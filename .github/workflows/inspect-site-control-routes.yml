name: Inspect Site Control Routes
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/inspect-site-control-routes.yml
      - scripts/inspect-site-control-routes.ps1
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        env:
          GK_SITE_URL: ${{ secrets.GK_SITE_URL }}
          GK_CONTROL_TOKEN: ${{ secrets.GK_CONTROL_TOKEN }}
          GK_UNIFIED_API_TOKEN: ${{ secrets.GK_UNIFIED_API_TOKEN }}
          GK_SITE_AUDIT_TOKEN: ${{ secrets.GK_SITE_AUDIT_TOKEN }}
        run: |
          @"
          GK_SITE_URL=$env:GK_SITE_URL
          GK_CONTROL_TOKEN=$env:GK_CONTROL_TOKEN
          GK_UNIFIED_API_TOKEN=$env:GK_UNIFIED_API_TOKEN
          GK_SITE_AUDIT_TOKEN=$env:GK_SITE_AUDIT_TOKEN
          "@|Set-Content .env -Encoding UTF8
          .\scripts\inspect-site-control-routes.ps1 -EnvFile .\.env
