name: Normalize DSL Legacy Duplicates

on:
  push:
    branches: [agent/verified-production-worker]
    paths:
      - scripts/normalize-dsl-legacy-duplicates.ps1
      - .github/workflows/normalize-dsl-legacy-duplicates.yml

permissions:
  contents: read

jobs:
  normalize:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare protected configuration
        shell: powershell
        env:
          GK_SITE_URL: ${{ secrets.GK_SITE_URL }}
          GK_UNIFIED_API_TOKEN: ${{ secrets.GK_UNIFIED_API_TOKEN }}
        run: |
          @"
          GK_SITE_URL=$env:GK_SITE_URL
          GK_UNIFIED_API_TOKEN=$env:GK_UNIFIED_API_TOKEN
          "@ | Set-Content .env -Encoding UTF8
      - name: Preview guarded normalization
        shell: powershell
        run: .\scripts\normalize-dsl-legacy-duplicates.ps1 -Mode Preview -EnvFile .\.env
      - name: Apply guarded normalization
        shell: powershell
        run: .\scripts\normalize-dsl-legacy-duplicates.ps1 -Mode Apply -Confirm 'DSL ALTINHALTE NORMALISIEREN' -EnvFile .\.env
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsl-legacy-normalization
          path: |
            backups/dsl-legacy-normalize-*/**
            reports/dsl-legacy-normalize-*.csv
          if-no-files-found: error
