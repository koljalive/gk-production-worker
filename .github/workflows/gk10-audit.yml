name: GK10 Live Audit

on:
  push:
    branches: [ main ]
    paths:
      - 'bridge/gk10-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run comprehensive audit
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & "$env:GITHUB_WORKSPACE\bridge\Run-GK10Audit.ps1"

      - name: Upload GK10 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gk10-audit-${{ github.run_id }}
          path: bridge/gk10-audit.json
          if-no-files-found: error
          retention-days: 7
