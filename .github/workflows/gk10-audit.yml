name: GK10 Live Audit

on:
  push:
    branches: [ main ]
    paths:
      - 'bridge/gk10-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gk10-live-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run comprehensive audit
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & "$env:GITHUB_WORKSPACE\bridge\Run-GK10Audit.ps1"

      - name: Upload GK10 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gk10-audit-${{ github.run_id }}
          path: bridge/gk10-audit.json
          if-no-files-found: error
          retention-days: 7

      - name: Persist audit in repository
        if: success()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-Location $env:GITHUB_WORKSPACE
          git -c safe.directory="$env:GITHUB_WORKSPACE" config user.name "gk10-audit"
          git -c safe.directory="$env:GITHUB_WORKSPACE" config user.email "gk10-audit@users.noreply.github.com"
          git -c safe.directory="$env:GITHUB_WORKSPACE" fetch origin main
          git -c safe.directory="$env:GITHUB_WORKSPACE" reset --soft origin/main
          git -c safe.directory="$env:GITHUB_WORKSPACE" add bridge/gk10-audit.json
          git -c safe.directory="$env:GITHUB_WORKSPACE" diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git -c safe.directory="$env:GITHUB_WORKSPACE" commit -m "GK10 image audit [skip ci]"
            git -c safe.directory="$env:GITHUB_WORKSPACE" push origin HEAD:main
          }
