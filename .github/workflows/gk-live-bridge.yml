name: GK Live Bridge

on:
  push:
    branches: [ main ]
    paths:
      - 'bridge/request.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gk-live-bridge
  cancel-in-progress: false

jobs:
  execute:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Execute guarded WordPress request
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:GITHUB_WORKSPACE\bridge\Invoke-GKLiveBridge.ps1" `
            -RequestPath "$env:GITHUB_WORKSPACE\bridge\request.json" `
            -ResultPath "$env:GITHUB_WORKSPACE\bridge\result.json"

      - name: Publish bridge result
        if: always()
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $resultPath = "$env:GITHUB_WORKSPACE\bridge\result.json"
          if (-not (Test-Path $resultPath)) { throw 'bridge/result.json was not produced.' }
          $repo = '${{ github.repository }}'
          $api = "https://api.github.com/repos/$repo/contents/bridge/result.json"
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'gk-live-bridge'
          }
          $sha = $null
          try {
            $current = Invoke-RestMethod -Uri $api -Headers $headers -Method GET
            $sha = [string]$current.sha
          } catch {
            if (-not ($_.Exception.Response -and [int]$_.Exception.Response.StatusCode -eq 404)) { throw }
          }
          $bytes = [IO.File]::ReadAllBytes($resultPath)
          $payload = @{
            message = 'GK bridge result [skip ci]'
            content = [Convert]::ToBase64String($bytes)
            branch = 'main'
          }
          if ($sha) { $payload.sha = $sha }
          $json = $payload | ConvertTo-Json -Compress
          $utf8 = [Text.Encoding]::UTF8.GetBytes($json)
          Invoke-RestMethod -Uri $api -Headers $headers -Method PUT -Body $utf8 -ContentType 'application/json; charset=utf-8' | Out-Null

      - name: Upload bridge result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gk-bridge-result-${{ github.run_id }}
          path: bridge/result.json
          if-no-files-found: error
          retention-days: 7
