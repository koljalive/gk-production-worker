name: GK Live Bridge

on:
  push:
    branches: [ main ]
    paths:
      - 'bridge/request.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gk-live-bridge
  cancel-in-progress: false

jobs:
  execute:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Execute guarded WordPress request
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:GITHUB_WORKSPACE\bridge\Invoke-GKLiveBridge.ps1" `
            -RequestPath "$env:GITHUB_WORKSPACE\bridge\request.json" `
            -ResultPath "$env:GITHUB_WORKSPACE\bridge\result.json"

      - name: Upload bridge result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gk-bridge-result-${{ github.run_id }}
          path: bridge/result.json
          if-no-files-found: error
          retention-days: 7
