name: Review Batch Export
on:
  push:
    branches: [agent/verified-production-worker]
    paths:
      - .github/workflows/review-batch-export.yml
      - scripts/export-review-batch.ps1
permissions:
  contents: read
jobs:
  export:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare protected configuration
        shell: powershell
        env:
          GK_SITE_URL: ${{ secrets.GK_SITE_URL }}
          GK_UNIFIED_API_TOKEN: ${{ secrets.GK_UNIFIED_API_TOKEN }}
        run: |
          @"
          GK_SITE_URL=$env:GK_SITE_URL
          GK_UNIFIED_API_TOKEN=$env:GK_UNIFIED_API_TOKEN
          "@|Set-Content .env -Encoding UTF8
      - name: Export current review batch
        shell: powershell
        run: .\scripts\export-review-batch.ps1 -EnvFile .\.env -Ids 191,1001,1007,1009,1011,1012,3012,3013,3014,3023,3024,3025,4002,4003,4004,4005,4006,4008,4009,4010,5003,5004,5005,7004,7005,7007,7008,7009,8005,9002,9003,9006,11002,11003,12002,12005,13004,13005,14002,14003,16008,16009,17005,17007,17008,17010,17012,18003,18005,18006,18008,18009,18011,18012,19001,19002,19003,19004,19005,19006,19007,19009,19010,20798,20800,20824,21003,21004,21005,21006,21007,21008,21009,21041,21066,21966,21967,21968
      - uses: actions/upload-artifact@v4
        with:
          name: review-batch-current
          path: review-batch/**
          if-no-files-found: error
