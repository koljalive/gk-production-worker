name: Repair Technician Review 2026-07-20
on:
  push:
    branches: [agent/verified-production-worker]
    paths:
      - scripts/repair-technician-review-20260720.ps1
      - .github/workflows/repair-technician-review-20260720.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/repair-technician-review-20260720.ps1
      - .github/workflows/repair-technician-review-20260720.yml
permissions:
  contents: read
jobs:
  repair:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare protected configuration
        shell: pwsh
        env:
          GK_SITE_URL: ${{ secrets.GK_SITE_URL }}
          GK_UNIFIED_API_TOKEN: ${{ secrets.GK_UNIFIED_API_TOKEN }}
          GK_CONTROL_TOKEN: ${{ secrets.GK_CONTROL_TOKEN }}
        run: |
          @"
          GK_SITE_URL=$env:GK_SITE_URL
          GK_UNIFIED_API_TOKEN=$env:GK_UNIFIED_API_TOKEN
          GK_CONTROL_TOKEN=$env:GK_CONTROL_TOKEN
          "@ | Set-Content .env -Encoding utf8
      - name: Apply and verify technician corrections
        shell: pwsh
        run: ./scripts/repair-technician-review-20260720.ps1 -EnvFile ./.env
      - name: Upload backups and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technician-review-repair
          path: |
            backups/technician-review-*/**
            reports/technician-review-*.csv
          if-no-files-found: error
