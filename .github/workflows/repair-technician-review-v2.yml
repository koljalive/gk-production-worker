name: Repair Technician Review V2
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/repair-technician-review-v2.ps1
      - .github/workflows/repair-technician-review-v2.yml
  push:
    branches: [agent/verified-production-worker]
    paths:
      - scripts/repair-technician-review-v2.ps1
      - .github/workflows/repair-technician-review-v2.yml
permissions:
  contents: read
jobs:
  repair-and-render:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare protected configuration
        shell: pwsh
        env:
          GK_SITE_URL: ${{ secrets.GK_SITE_URL }}
          GK_UNIFIED_API_TOKEN: ${{ secrets.GK_UNIFIED_API_TOKEN }}
          GK_CONTROL_TOKEN: ${{ secrets.GK_CONTROL_TOKEN }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APPLICATION_PASSWORD: ${{ secrets.WP_APPLICATION_PASSWORD }}
        run: |
          @"
          GK_SITE_URL=$env:GK_SITE_URL
          GK_UNIFIED_API_TOKEN=$env:GK_UNIFIED_API_TOKEN
          GK_CONTROL_TOKEN=$env:GK_CONTROL_TOKEN
          WP_USERNAME=$env:WP_USERNAME
          WP_APPLICATION_PASSWORD=$env:WP_APPLICATION_PASSWORD
          "@ | Set-Content .env -Encoding utf8
      - name: Apply targeted repair with backups
        shell: pwsh
        run: ./scripts/repair-technician-review-v2.ps1 -EnvFile ./.env
      - name: Render public desktop and mobile evidence
        shell: pwsh
        run: |
          $edge = @(
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $edge) { throw 'Microsoft Edge wurde nicht gefunden.' }
          New-Item evidence/screenshots -ItemType Directory -Force | Out-Null
          $shotDir = (Resolve-Path evidence/screenshots).Path
          $slugs = 'apl-tae-signalweg','ftth-anschlussarten-erklaert','gf-ap-erklaert','router-im-keller'
          foreach ($slug in $slugs) {
            $url = "https://glasfaser-kompass.de/$slug/?visual_abnahme=1"
            $desktop = Join-Path $shotDir "$slug-desktop.png"
            $mobile = Join-Path $shotDir "$slug-mobile.png"
            $desktopProfile = Join-Path $env:RUNNER_TEMP ("edge-desktop-" + $slug)
            & $edge --headless=new --no-first-run --disable-extensions --disable-gpu --hide-scrollbars --user-data-dir="$desktopProfile" --window-size=1440,3000 --screenshot="$desktop" $url 2>$null
            if (-not (Test-Path $desktop)) { throw "Desktop-Rendering fehlgeschlagen: $slug" }
            Get-Process msedge -ErrorAction SilentlyContinue | Stop-Process -Force
            $mobileProfile = Join-Path $env:RUNNER_TEMP ("edge-mobile-" + $slug)
            & $edge --headless=new --no-first-run --disable-extensions --disable-gpu --hide-scrollbars --user-data-dir="$mobileProfile" --window-size=390,2400 --user-agent="Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 Chrome/126.0 Mobile Safari/537.36" --screenshot="$mobile" $url 2>$null
            if (-not (Test-Path $mobile)) { throw "Mobil-Rendering fehlgeschlagen: $slug" }
            Get-Process msedge -ErrorAction SilentlyContinue | Stop-Process -Force
          }
      - name: Upload backups, HTML and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technician-review-v2-evidence
          path: |
            backups/technician-review-v2-*/**
            reports/technician-review-v2-*.csv
            evidence/**
          if-no-files-found: error
