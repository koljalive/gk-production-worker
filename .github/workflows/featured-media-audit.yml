name: Featured Media Audit
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/featured-media-audit.yml
      - scripts/audit-featured-media.ps1
permissions:
  contents: read
jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site configuration
        shell: powershell
        env:
          GK_SITE_URL: ${{ secrets.GK_SITE_URL }}
          GK_SITE_AUDIT_TOKEN: ${{ secrets.GK_SITE_AUDIT_TOKEN }}
          GK_UNIFIED_API_TOKEN: ${{ secrets.GK_UNIFIED_API_TOKEN }}
          GK_CONTROL_TOKEN: ${{ secrets.GK_CONTROL_TOKEN }}
        run: |
          @"
          GK_SITE_URL=$env:GK_SITE_URL
          GK_SITE_AUDIT_TOKEN=$env:GK_SITE_AUDIT_TOKEN
          GK_UNIFIED_API_TOKEN=$env:GK_UNIFIED_API_TOKEN
          GK_CONTROL_TOKEN=$env:GK_CONTROL_TOKEN
          "@|Set-Content .env -Encoding UTF8
      - name: Correct object visual mismatches
        shell: powershell
        run: .\scripts\fix-object-visual-mismatches.ps1 -EnvFile .\.env
      - name: Correct DSL signal paths and APL schematics
        shell: powershell
        run: .\scripts\fix-dsl-signal-path.ps1 -EnvFile .\.env
      - name: Verify legal notice
        shell: powershell
        run: .\scripts\restore-legal-pages.ps1 -EnvFile .\.env
      - name: Repair encoding and related-link readability
        shell: powershell
        run: .\scripts\rebuild-related-links.ps1 -Mode Apply -Confirm "WEITERFUEHRENDE LINKS NEU BAUEN" -EnvFile .\.env
      - name: Audit featured media
        shell: powershell
        run: .\scripts\audit-featured-media.ps1 -EnvFile .\.env -Ids 191,1001,1007,1009,1011,1012,3012,3013,3014,3023,3024,3025,4002,4003,4004,4005,4006,4008,4009,4010,5003,5004,5005,7004,7005,7007,7008,7009,8005,9002,9003,9006,11002,11003,12002,12005,13004,13005,14002,14003,16008,16009,17005,17007,17008,17010,17012,18003,18005,18006,18008,18009,18011,18012,19001,19002,19003,19004,19005,19006,19007,19009,19010,20798,20800,20824,21003,21004,21005,21006,21007,21008,21009,21041,21066,21966,21967,21968
      - name: Audit DSL signal paths and APL visuals
        shell: powershell
        run: .\scripts\audit-dsl-signal-path.ps1 -EnvFile .\.env
      - name: Audit mobile images and placeholders
        shell: powershell
        run: .\scripts\audit-mobile-images.ps1 -EnvFile .\.env
      - uses: actions/upload-artifact@v4
        with:
          name: featured-media-audit
          path: |
            reports/featured-media-audit-*.csv
            reports/dsl-signal-audit-*.json
            reports/mobile-image-audit-*.json
          if-no-files-found: error



