name: Diagnose Self-Hosted Runner

on:
  push:
    branches: [ main ]
    paths:
      - 'bridge/runner-diagnostic-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Query repository runners
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.error, datetime
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          url = f'https://api.github.com/repos/{repo}/actions/runners'
          req = urllib.request.Request(url, headers={
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'GKRunnerDiagnostic'
          })
          out = {'queried_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'repository': repo}
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.load(r)
                  out['http_status'] = r.status
                  out['total_count'] = data.get('total_count')
                  out['runners'] = [
                      {
                          'id': x.get('id'),
                          'name': x.get('name'),
                          'os': x.get('os'),
                          'status': x.get('status'),
                          'busy': x.get('busy'),
                          'labels': [l.get('name') for l in x.get('labels', [])]
                      }
                      for x in data.get('runners', [])
                  ]
          except urllib.error.HTTPError as e:
              out['http_status'] = e.code
              out['error_body'] = e.read().decode('utf-8', 'replace')
          except Exception as e:
              out['error'] = repr(e)
          with open('bridge/runner-diagnostic.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,indent=2)
              f.write('\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "gk-runner-diagnostic"
          git config user.email "gk-runner-diagnostic@users.noreply.github.com"
          git add bridge/runner-diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m "GK runner diagnostic [skip ci]"
            git push origin HEAD:main
          fi
