name: GK Actions Runs Diagnostic

on:
  push:
    branches: [ main ]
    paths:
      - 'bridge/actions-runs-trigger.txt'

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect recent workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/runs?per_page=30" \
            -o bridge/actions-runs-diagnostic.json
          git config user.name "gk-actions-diagnostic"
          git config user.email "gk-actions-diagnostic@users.noreply.github.com"
          git add bridge/actions-runs-diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m "GK actions runs diagnostic [skip ci]"
            git push origin HEAD:main
          fi
