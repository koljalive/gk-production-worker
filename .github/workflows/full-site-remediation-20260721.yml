name: Full Site Remediation 2026-07-21
on:
  push:
    branches: [agent/full-site-remediation-20260721]
    paths:
      - scripts/full-site-remediation-20260721.ps1
      - .github/workflows/full-site-remediation-20260721.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remediate:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Preview complete plan
        shell: pwsh
        env:
          GK_SITE_URL: ${{ secrets.GK_SITE_URL }}
          GK_UNIFIED_API_TOKEN: ${{ secrets.GK_UNIFIED_API_TOKEN }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APPLICATION_PASSWORD: ${{ secrets.WP_APPLICATION_PASSWORD }}
        run: .\scripts\full-site-remediation-20260721.ps1 -Mode Preview
      - name: Apply, read back and verify publicly
        shell: pwsh
        env:
          GK_SITE_URL: ${{ secrets.GK_SITE_URL }}
          GK_UNIFIED_API_TOKEN: ${{ secrets.GK_UNIFIED_API_TOKEN }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APPLICATION_PASSWORD: ${{ secrets.WP_APPLICATION_PASSWORD }}
        run: .\scripts\full-site-remediation-20260721.ps1 -Mode Apply
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-site-remediation-20260721
          path: |
            reports/**
            backups/**
          if-no-files-found: warn
