name: GK Visible Image Fix

on:
  push:
    branches: [ main ]
    paths:
      - 'bridge/visible-image-fix-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace actually rendered images
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & "$env:GITHUB_WORKSPACE\bridge\Run-GKVisibleImageFix.ps1"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gk-visible-image-fix-${{ github.run_id }}
          path: bridge/visible-image-fix-result.json
          if-no-files-found: error
          retention-days: 7

      - name: Persist result
        if: success()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-Location $env:GITHUB_WORKSPACE
          git -c safe.directory="$env:GITHUB_WORKSPACE" config user.name "gk-visible-image-fix"
          git -c safe.directory="$env:GITHUB_WORKSPACE" config user.email "gk-visible-image-fix@users.noreply.github.com"
          git -c safe.directory="$env:GITHUB_WORKSPACE" fetch origin main
          git -c safe.directory="$env:GITHUB_WORKSPACE" reset --soft origin/main
          git -c safe.directory="$env:GITHUB_WORKSPACE" add bridge/visible-image-fix-result.json
          git -c safe.directory="$env:GITHUB_WORKSPACE" diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git -c safe.directory="$env:GITHUB_WORKSPACE" commit -m "GK visible image fix result [skip ci]"
            git -c safe.directory="$env:GITHUB_WORKSPACE" push origin HEAD:main
          }
