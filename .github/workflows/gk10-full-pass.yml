name: GK10 Full 361 Pass

on:
  push:
    branches: [ main ]
    paths:
      - 'bridge/gk10-full-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gk10-full-361
  cancel-in-progress: false

jobs:
  full-pass:
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run complete 361-content audit
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & "$env:GITHUB_WORKSPACE\bridge\Run-GK10FullPass.ps1"

      - name: Upload full result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gk10-full-${{ github.run_id }}
          path: |
            bridge/gk10-full-result.json
            bridge/gk10-full-progress.json
          if-no-files-found: warn
          retention-days: 14

      - name: Persist result
        if: success()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-Location $env:GITHUB_WORKSPACE
          git -c safe.directory="$env:GITHUB_WORKSPACE" config user.name "gk10-full"
          git -c safe.directory="$env:GITHUB_WORKSPACE" config user.email "gk10-full@users.noreply.github.com"
          git -c safe.directory="$env:GITHUB_WORKSPACE" fetch origin main
          git -c safe.directory="$env:GITHUB_WORKSPACE" reset --soft origin/main
          git -c safe.directory="$env:GITHUB_WORKSPACE" add bridge/gk10-full-result.json
          if (Test-Path bridge/gk10-full-progress.json) { git -c safe.directory="$env:GITHUB_WORKSPACE" add bridge/gk10-full-progress.json }
          git -c safe.directory="$env:GITHUB_WORKSPACE" diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git -c safe.directory="$env:GITHUB_WORKSPACE" commit -m "GK10 full 361 result [skip ci]"
            git -c safe.directory="$env:GITHUB_WORKSPACE" push origin HEAD:main
          }
