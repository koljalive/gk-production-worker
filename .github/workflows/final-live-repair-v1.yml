name: Final Live Repair V1
on:
  push:
    branches: [agent/verified-production-worker]
    paths:
      - scripts/final-live-repair-v1.ps1
      - .github/workflows/final-live-repair-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify complete deterministic repair
        shell: pwsh
        env:
          GK_SITE_URL: ${{ secrets.GK_SITE_URL }}
          GK_UNIFIED_API_TOKEN: ${{ secrets.GK_UNIFIED_API_TOKEN }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APPLICATION_PASSWORD: ${{ secrets.WP_APPLICATION_PASSWORD }}
        run: |
          .\scripts\final-live-repair-v1.ps1 -Mode Preview
          .\scripts\final-live-repair-v1.ps1 -Mode Apply
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-live-repair-v1
          path: |
            reports/**
            backups/**
          if-no-files-found: error
