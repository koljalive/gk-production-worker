name: Complete Factual Site Audit
on:
  push:
    branches: [agent/verified-production-worker]
    paths:
      - .github/workflows/complete-factual-site-audit.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: complete-factual-site-audit
  cancel-in-progress: true
jobs:
  final-status:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Prepare production configuration
        shell: pwsh
        run: Copy-Item config.example.json config.json
      - name: Record final queue status without additional AI calls
        shell: pwsh
        env:
          GK_SITE_URL: ${{ secrets.GK_SITE_URL }}
          GK_API_BASE_URL: ${{ secrets.GK_SITE_URL }}/wp-json/gk-site-audit/v1/
          GK_API_TOKEN: ${{ secrets.GK_SITE_AUDIT_TOKEN }}
          GK_SITE_AUDIT_TOKEN: ${{ secrets.GK_SITE_AUDIT_TOKEN }}
          GK_UNIFIED_API_TOKEN: ${{ secrets.GK_UNIFIED_API_TOKEN }}
        run: dotnet run --project src/GkProductionWorker -c Release -- status --config config.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-factual-site-audit-status
          path: |
            reports/**
            logs/**
            state/**
          if-no-files-found: warn
