name: Deterministic Content Cleanup
on:
  push:
    branches: [agent/verified-production-worker]
    paths:
      - .github/workflows/deterministic-cleanup.yml
      - scripts/cleanup-deterministic-content.ps1
permissions:
  contents: read
jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Self-test
        shell: powershell
        run: .\scripts\cleanup-deterministic-content.ps1 -SelfTest
      - name: Prepare protected configuration
        shell: powershell
        env:
          GK_SITE_URL: ${{ secrets.GK_SITE_URL }}
          GK_SITE_AUDIT_TOKEN: ${{ secrets.GK_SITE_AUDIT_TOKEN }}
          GK_UNIFIED_API_TOKEN: ${{ secrets.GK_UNIFIED_API_TOKEN }}
        run: |
          @"
          GK_SITE_URL=$env:GK_SITE_URL
          GK_SITE_AUDIT_TOKEN=$env:GK_SITE_AUDIT_TOKEN
          GK_UNIFIED_API_TOKEN=$env:GK_UNIFIED_API_TOKEN
          "@|Set-Content .env -Encoding UTF8
      - name: Preview deterministic cleanup
        shell: powershell
        run: .\scripts\cleanup-deterministic-content.ps1 -Mode Preview -EnvFile .\.env
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-cleanup-preview
          path: reports/**
          if-no-files-found: error
