name: GK10 Remaining Repair
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  offline-utf8-rebuild:
    runs-on: self-hosted
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Parser gate for complete offline chain
        shell: cmd
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$files=@('Export-GKOfflineSnapshot.ps1','Analyze-GKOfflineSnapshot.ps1','Simulate-GKOfflineImprovements.ps1','Prepare-GKOfflineReview.ps1','Prepare-GKOfflineMedia.ps1','Analyze-GKOfflineDuplicates.ps1','Prepare-GKOfflineEditorialBatch.ps1','Analyze-GKOfflineEditorialBatch.ps1','Build-GKOfflinePilot.ps1');foreach($f in $files){$tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile(($env:GITHUB_WORKSPACE+'\bridge\'+$f),[ref]$tokens,[ref]$errors)|Out-Null;if($errors.Count -gt 0){Write-Host ($errors -join [Environment]::NewLine);exit 1}}"
      - name: Rebuild verified UTF-8 offline foundation and pilot
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\bridge\Export-GKOfflineSnapshot.ps1" || exit /b 1
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\bridge\Analyze-GKOfflineSnapshot.ps1" || exit /b 1
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\bridge\Simulate-GKOfflineImprovements.ps1" || exit /b 1
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\bridge\Prepare-GKOfflineReview.ps1" || exit /b 1
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\bridge\Prepare-GKOfflineMedia.ps1" || exit /b 1
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\bridge\Analyze-GKOfflineDuplicates.ps1" || exit /b 1
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\bridge\Prepare-GKOfflineEditorialBatch.ps1" || exit /b 1
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\bridge\Analyze-GKOfflineEditorialBatch.ps1" || exit /b 1
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\bridge\Build-GKOfflinePilot.ps1" || exit /b 1
      - name: Persist rebuilt offline evidence
        if: always()
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%"
          if not exist bridge\gk-offline-pilot.json exit /b 1
          git -c safe.directory="%GITHUB_WORKSPACE%" config user.name "gk-offline-audit"
          git -c safe.directory="%GITHUB_WORKSPACE%" config user.email "gk-offline-audit@users.noreply.github.com"
          git -c safe.directory="%GITHUB_WORKSPACE%" fetch origin main
          git -c safe.directory="%GITHUB_WORKSPACE%" reset --soft origin/main
          git -c safe.directory="%GITHUB_WORKSPACE%" add bridge/gk-offline-*.json
          git -c safe.directory="%GITHUB_WORKSPACE%" diff --cached --quiet || (git -c safe.directory="%GITHUB_WORKSPACE%" commit -m "Rebuild complete UTF-8 offline evidence [skip ci]" && git -c safe.directory="%GITHUB_WORKSPACE%" push origin HEAD:main)