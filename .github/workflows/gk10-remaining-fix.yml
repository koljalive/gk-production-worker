name: GK10 Remaining Repair

on:
  push:
    branches: [ main ]
    paths:
      - 'bridge/gk10-remaining-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gk10-remaining-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run strict acceptance pilot before any bulk repair
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & "$env:GITHUB_WORKSPACE\bridge\Run-GKAcceptancePilot.ps1"
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gk-acceptance-pilot-${{ github.run_id }}
          path: |
            bridge/acceptance-pilot-result.json
            bridge/acceptance-router-desktop.png
            bridge/acceptance-router-mobile.png
            bridge/acceptance-praxiswissen-desktop.png
            bridge/acceptance-praxiswissen-mobile.png
          if-no-files-found: warn
          retention-days: 14
      - name: Persist acceptance result
        if: success()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-Location $env:GITHUB_WORKSPACE
          git -c safe.directory="$env:GITHUB_WORKSPACE" config user.name "gk-acceptance-pilot"
          git -c safe.directory="$env:GITHUB_WORKSPACE" config user.email "gk-acceptance-pilot@users.noreply.github.com"
          git -c safe.directory="$env:GITHUB_WORKSPACE" fetch origin main
          git -c safe.directory="$env:GITHUB_WORKSPACE" reset --soft origin/main
          git -c safe.directory="$env:GITHUB_WORKSPACE" add bridge/acceptance-pilot-result.json
          git -c safe.directory="$env:GITHUB_WORKSPACE" diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git -c safe.directory="$env:GITHUB_WORKSPACE" commit -m "GK acceptance pilot result [skip ci]"
            git -c safe.directory="$env:GITHUB_WORKSPACE" push origin HEAD:main
          }
