name: GK10 Remaining Repair
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gk10-remaining-repair
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Parser gate
        shell: cmd
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile(($env:GITHUB_WORKSPACE+'\bridge\Export-GKOfflineSnapshot.ps1'),[ref]$tokens,[ref]$errors)|Out-Null;if($errors.Count -gt 0){Write-Host ($errors -join [Environment]::NewLine);exit 1}"
      - name: Export complete WordPress snapshot without writes
        shell: cmd
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\bridge\Export-GKOfflineSnapshot.ps1"
      - name: Persist snapshot
        if: always()
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%"
          if not exist bridge\gk-offline-snapshot.json exit /b 1
          git -c safe.directory="%GITHUB_WORKSPACE%" config user.name "gk-offline-audit"
          git -c safe.directory="%GITHUB_WORKSPACE%" config user.email "gk-offline-audit@users.noreply.github.com"
          git -c safe.directory="%GITHUB_WORKSPACE%" fetch origin main
          git -c safe.directory="%GITHUB_WORKSPACE%" reset --soft origin/main
          git -c safe.directory="%GITHUB_WORKSPACE%" add bridge/gk-offline-snapshot.json bridge/gk-offline-snapshot-manifest.json
          git -c safe.directory="%GITHUB_WORKSPACE%" diff --cached --quiet || (git -c safe.directory="%GITHUB_WORKSPACE%" commit -m "Persist complete read-only WordPress snapshot [skip ci]" && git -c safe.directory="%GITHUB_WORKSPACE%" push origin HEAD:main)