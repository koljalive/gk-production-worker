name: GK10 Remaining Repair
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  offline-pilot:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Parser gate
        shell: cmd
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile(($env:GITHUB_WORKSPACE+'\bridge\Build-GKOfflinePilot.ps1'),[ref]$tokens,[ref]$errors)|Out-Null;if($errors.Count -gt 0){Write-Host ($errors -join [Environment]::NewLine);exit 1}"
      - name: Build and fully simulate three-page pilot
        shell: cmd
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\bridge\Build-GKOfflinePilot.ps1"
      - name: Persist offline pilot
        if: always()
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%"
          if not exist bridge\gk-offline-pilot.json exit /b 1
          git -c safe.directory="%GITHUB_WORKSPACE%" config user.name "gk-offline-audit"
          git -c safe.directory="%GITHUB_WORKSPACE%" config user.email "gk-offline-audit@users.noreply.github.com"
          git -c safe.directory="%GITHUB_WORKSPACE%" fetch origin main
          git -c safe.directory="%GITHUB_WORKSPACE%" reset --soft origin/main
          git -c safe.directory="%GITHUB_WORKSPACE%" add bridge/gk-offline-pilot.json
          git -c safe.directory="%GITHUB_WORKSPACE%" diff --cached --quiet || (git -c safe.directory="%GITHUB_WORKSPACE%" commit -m "Persist fully simulated offline pilot [skip ci]" && git -c safe.directory="%GITHUB_WORKSPACE%" push origin HEAD:main)