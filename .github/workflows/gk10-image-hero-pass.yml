name: GK10 Image Hero Pass

on:
  push:
    paths:
      - 'bridge/gk10-image-hero-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: [self-hosted, gk-bridge]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark workspace safe
        shell: powershell
        run: git config --global --add safe.directory "$env:GITHUB_WORKSPACE"

      - name: Run GK10 image and hero pass
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "bridge/Run-GK10ImageAndHeroPass.ps1"

      - name: Commit verified result
        shell: powershell
        run: |
          git config user.name "gk-bridge"
          git config user.email "gk-bridge@users.noreply.github.com"
          git add bridge/gk10-image-hero-result.json
          if (-not (git diff --cached --quiet)) {
            git commit -m "GK10 image hero result [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          }
