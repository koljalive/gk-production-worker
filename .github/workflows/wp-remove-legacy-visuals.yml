name: Remove Superseded Website Visuals

on:
  push:
    branches: [agent/wp-cleanup]
    paths:
      - recovery/remove_legacy_visuals.py
      - .github/workflows/wp-remove-legacy-visuals.yml

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Remove and verify superseded visuals
        env:
          GK_SITE_URL: ${{ secrets.GK_SITE_URL }}
          GK_UNIFIED_API_TOKEN: ${{ secrets.GK_UNIFIED_API_TOKEN }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APPLICATION_PASSWORD: ${{ secrets.WP_APPLICATION_PASSWORD }}
        run: python recovery/remove_legacy_visuals.py
